<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BeautyGraph</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --ivory: #faf8f2;
      --ivory-deep: #f4f1e8;

      --sage-050: #f3f5f0;
      --sage-100: #e9eee5;
      --sage-200: #d8e0d2;
      --sage-300: #bac8b4;
      --sage-400: #a5b39c;
      --sage-500: #7f9278;
      --sage-600: #647963;
      --sage-700: #4f6251;

      --ink: #354038;
      --muted: #777b73;

      --line: rgba(79, 98, 81, 0.13);
      --white-soft: rgba(255,255,255,0.58);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family: "Inter", -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      color: var(--ink);

      background:
        radial-gradient(
          ellipse at 8% 18%,
          rgba(210, 222, 205, 0.22),
          transparent 24%
        ),
        radial-gradient(
          ellipse at 91% 41%,
          rgba(232, 206, 195, 0.13),
          transparent 20%
        ),
        var(--ivory);
    }

    button,
    select {
      font: inherit;
    }

    .shell {
      max-width: 1180px;
      margin: auto;
      padding: 24px 28px 70px;
    }

    /* ---------------- Navigation ---------------- */

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--line);

      padding: 5px 0 22px;
      margin-bottom: 62px;
    }

    .brand {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--sage-700);
    }

    .nav-links {
      display: flex;
      gap: 37px;
      align-items: center;
    }

    .nav-link {
      border: none;
      background: transparent;

      padding: 10px 0;

      cursor: pointer;

      font-size: 15px;
      color: var(--muted);
    }

    .nav-link.active {
      color: var(--sage-700);
      font-weight: 600;
      position: relative;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;

      left: 16%;
      right: 16%;
      bottom: -8px;

      height: 1px;
      background: var(--sage-500);
    }

    /* ---------------- Typography ---------------- */

    .eyebrow {
      color: var(--sage-600);

      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.17em;
      text-transform: uppercase;

      margin-bottom: 12px;
    }

    h1,
    h2,
    h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;

      color: var(--ink);

      margin-top: 0;
      letter-spacing: -0.025em;
    }

    h1 {
      font-size: clamp(48px, 5vw, 66px);
      line-height: 0.98;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 45px;
      line-height: 1.05;
    }

    h3 {
      font-size: 28px;
    }

    .intro {
      max-width: 890px;

      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;

      margin: 0 0 52px;
    }

    /* ---------------- Home ---------------- */

    .hero {
      min-height: 520px;

      display: grid;
      grid-template-columns: 1fr 0.9fr;
      align-items: center;
      gap: 50px;

      padding: 58px 66px;

      border: 1px solid rgba(79,98,81,.09);
      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          rgba(243,245,240,.92),
          rgba(250,248,242,.72)
        );
    }

    .hero-title {
      font-size: clamp(70px, 7vw, 105px);
      line-height: .91;
      letter-spacing: -.05em;

      color: var(--sage-700);

      margin: 15px 0 30px;
    }

    .hero-copy {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;

      max-width: 560px;
    }

    .hero img {
      width: 100%;
      max-height: 430px;

      object-fit: contain;
      display: block;

      mix-blend-mode: multiply;
    }

    /* ---------------- Controls ---------------- */

    .field-label {
      color: var(--sage-700);
      font-weight: 500;

      margin-bottom: 10px;
    }

    select {
      width: 100%;

      border: 0;
      outline: 0;

      padding: 18px 16px;

      border-radius: 12px;

      background: var(--sage-100);

      color: var(--ink);
      font-size: 16px;

      cursor: pointer;
    }

    .selector-block {
      margin-bottom: 42px;
    }

    .two-selectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;

      margin-bottom: 46px;
    }

    /* ---------------- Product hero ---------------- */

    .product-hero {
      min-height: 340px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 35px;
      align-items: center;

      border: 1px solid rgba(79,98,81,.13);
      border-radius: 28px;

      background:
        linear-gradient(
          120deg,
          rgba(222,231,216,.57),
          rgba(255,255,255,.18)
        );

      padding: 45px 48px;

      margin-bottom: 55px;
    }

    .brand-name {
      color: var(--sage-600);

      text-transform: uppercase;
      letter-spacing: .16em;

      font-size: 13px;
      font-weight: 600;

      margin-bottom: 12px;
    }

    .product-title {
      font-size: clamp(44px, 5vw, 70px);
      line-height: .96;

      margin-bottom: 30px;
    }

    .tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;

      padding: 10px 16px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: rgba(255,255,255,.6);

      color: var(--sage-700);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .product-image {
      width: 100%;
      max-height: 245px;

      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* ---------------- Sections / cards ---------------- */

    .section {
      margin-top: 58px;
    }

    .section-head {
      margin-bottom: 28px;
    }

    .section-head h2 {
      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .soft-card {
      border: 1px solid var(--line);
      border-radius: 24px;

      background: rgba(255,255,255,.42);

      padding: 30px;
    }

    /* ---------------- Formula profile ---------------- */

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 18px;
    }

    .profile-item {
      padding: 20px 22px;

      background: rgba(255,255,255,.48);

      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .profile-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      margin-bottom: 12px;
    }

    .profile-label {
      font-size: 14px;
      font-weight: 500;
    }

    .profile-number {
      color: var(--sage-700);
      font-weight: 600;
    }

    .track {
      height: 7px;

      border-radius: 999px;

      background: var(--sage-100);
      overflow: hidden;
    }

    .fill {
      height: 100%;

      background: linear-gradient(
        90deg,
        var(--sage-300),
        var(--sage-500)
      );

      border-radius: inherit;
    }

    /* ---------------- Ingredients ---------------- */

    .ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .ingredient {
      display: inline-flex;
      gap: 8px;
      align-items: center;

      background: rgba(255,255,255,.55);

      border: 1px solid var(--line);
      border-radius: 999px;

      padding: 9px 13px;

      font-size: 13px;
    }

    .ingredient-position {
      color: var(--sage-500);
      font-size: 11px;
      font-weight: 600;
    }

    /* ---------------- Compare ---------------- */

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;

      margin-bottom: 30px;
    }

    .metric {
      padding: 26px 25px;

      border: 1px solid var(--line);
      border-radius: 22px;

      background: rgba(255,255,255,.48);
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;

      margin-bottom: 5px;
    }

    .metric-value {
      font-family: "Cormorant Garamond", Georgia, serif;

      color: var(--sage-700);

      font-size: 54px;
      line-height: 1;
    }

    .compare-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;

      margin-top: 22px;
    }

    .detail-label {
      color: var(--sage-600);

      font-size: 12px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: .1em;

      margin-bottom: 12px;
    }

    .detail-text {
      font-size: 16px;
      line-height: 1.65;
    }

    .explanation {
      margin-top: 25px;

      padding: 27px 30px;

      border-left: 3px solid var(--sage-300);

      background: rgba(233,238,229,.46);

      color: #525c54;

      line-height: 1.75;
      font-size: 15px;
    }

    /* ---------------- Full Compare page ---------------- */

    .compare-product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;

      margin: 0 0 55px;
    }

    .compare-product-card {
      position: relative;
      overflow: hidden;

      min-height: 265px;
      padding: 34px 36px;

      border: 1px solid var(--line);
      border-radius: 26px;
    }

    .compare-product-a {
      background:
        linear-gradient(
          135deg,
          rgba(216,224,210,.76),
          rgba(250,248,242,.84)
        );
    }

    .compare-product-b {
      background:
        linear-gradient(
          135deg,
          rgba(243,228,222,.68),
          rgba(250,248,242,.88)
        );
    }

    .compare-product-copy {
      position: relative;
      z-index: 3;

      max-width: calc(100% - 150px);
    }

    .compare-label {
      margin-bottom: 15px;

      color: var(--sage-600);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .compare-product-b .compare-label {
      color: #9a746a;
    }

    .compare-brand {
      margin-bottom: 7px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .compare-name {
      max-width: 520px;

      font-family: "Cormorant Garamond", Georgia, serif;

      color: var(--ink);

      font-size: clamp(34px, 3vw, 48px);
      line-height: .98;
      letter-spacing: -.035em;
    }

    .compare-form {
      display: inline-flex;

      margin-top: 22px;
      padding: 8px 13px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: rgba(255,255,255,.48);

      color: var(--sage-700);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .compare-art {
      position: absolute;

      z-index: 2;

      right: 23px;
      bottom: 18px;

      width: auto;
      max-width: 140px;
      max-height: 145px;

      object-fit: contain;

      opacity: .95;
      mix-blend-mode: multiply;
    }


    /* Explanation first */

    .explanation-wrap {
      margin: 28px 0 62px;
      padding: 42px 44px;

      border: 1px solid var(--line);
      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          rgba(216,224,210,.62),
          rgba(243,228,222,.25),
          rgba(250,248,242,.78)
        );
    }

    .explanation-lead {
      max-width: 1020px;

      margin-bottom: 30px;

      font-family: "Cormorant Garamond", Georgia, serif;

      color: var(--ink);

      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.2;
      letter-spacing: -.025em;
    }

    .explanation-lead strong {
      color: var(--sage-700);
      font-weight: 600;
    }

    .explanation-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .explanation-point {
      min-height: 170px;

      padding: 24px 25px;

      background: rgba(255,255,255,.42);

      border: 1px solid rgba(79,98,81,.09);
      border-radius: 20px;
    }

    .explanation-point-label {
      margin-bottom: 14px;

      color: var(--sage-600);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .explanation-point-text {
      color: var(--ink);

      font-size: 15px;
      line-height: 1.68;
    }

    .explanation-point-text .line + .line {
      margin-top: 13px;
    }

    .explanation-note {
      margin-top: 26px;
      padding-top: 18px;

      border-top: 1px solid var(--line);

      color: var(--muted);

      font-size: 13px;
      line-height: 1.65;
    }


    /* Shared / different ingredients */

    .shared-card {
      padding: 30px 31px;

      border: 1px solid var(--line);
      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(233,238,229,.62),
          rgba(255,255,255,.34)
        );
    }

    .shared-summary {
      margin-bottom: 27px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.6;
    }

    .detail-heading {
      margin: 0 0 16px;

      font-family: "Cormorant Garamond", Georgia, serif;

      color: var(--ink);

      font-size: 29px;
      line-height: 1.08;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;

      padding: 8px 12px;

      background: var(--sage-050);

      border: 1px solid rgba(79,98,81,.09);
      border-radius: 999px;

      color: var(--ink);

      font-size: 13px;
      line-height: 1.25;
    }

    .chip-blush {
      background: #f3e4de;
      border-color: rgba(154,116,106,.10);
    }

    .detail-spacer {
      height: 29px;
    }

    .difference-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .difference-card {
      padding: 29px 30px;

      background: rgba(255,255,255,.40);

      border: 1px solid var(--line);
      border-radius: 23px;
    }

    .difference-a {
      border-top: 3px solid rgba(127,146,120,.50);
    }

    .difference-b {
      border-top: 3px solid rgba(210,166,153,.42);
    }


    /* Function differences */

    .function-diff-card {
      padding: 13px 31px;

      border: 1px solid var(--line);
      border-radius: 24px;

      background: rgba(255,255,255,.42);
    }

    .function-diff-row {
      display: grid;
      grid-template-columns: 220px 1fr 1fr;

      gap: 20px;
      align-items: center;

      padding: 18px 0;

      border-bottom: 1px solid var(--line);
    }

    .function-diff-row:last-child {
      border-bottom: none;
    }

    .function-name {
      font-weight: 500;
      font-size: 14px;
    }

    .function-a {
      color: var(--sage-600);

      font-size: 14px;
      font-weight: 600;
    }

    .function-b {
      color: #9a746a;

      font-size: 14px;
      font-weight: 600;
    }


    @media (max-width: 850px) {
      .compare-product-grid,
      .explanation-grid,
      .difference-grid {
        grid-template-columns: 1fr;
      }

      .compare-product-copy {
        max-width: calc(100% - 100px);
      }

      .compare-art {
        max-width: 95px;
        max-height: 100px;
      }

      .function-diff-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .explanation-wrap {
        padding: 30px 26px;
      }
    }


    /* ---------------- Similar ---------------- */

    .selected-summary {
      margin-bottom: 58px;
    }

    .similar-list {
      display: grid;
      gap: 18px;
    }

    .similar-card {
      display: grid;
      grid-template-columns: 68px minmax(0,1fr) 180px;
      gap: 24px;
      align-items: center;

      padding: 30px 32px;

      border: 1px solid var(--line);
      border-radius: 24px;

      background: rgba(255,255,255,.48);
    }

    .rank {
      font-family: "Cormorant Garamond", Georgia, serif;

      color: var(--sage-400);

      font-size: 42px;
      font-weight: 500;
    }

    .similar-brand {
      color: var(--sage-600);

      text-transform: uppercase;

      letter-spacing: .12em;
      font-size: 11px;
      font-weight: 600;

      margin-bottom: 5px;
    }

    .similar-name {
      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 30px;
      line-height: 1.05;

      margin-bottom: 14px;
    }

    .similar-context {
      margin-top: 18px;

      font-size: 15px;
      line-height: 1.65;

      color: #626860;
    }

    .score-box {
      text-align: right;
    }

    .score {
      font-family: "Cormorant Garamond", Georgia, serif;

      color: var(--sage-700);

      font-size: 55px;
      line-height: .95;

      margin-bottom: 8px;
    }

    .score-track {
      height: 7px;

      background: var(--sage-100);

      border-radius: 999px;

      overflow: hidden;
      margin-bottom: 13px;
    }

    .score-fill {
      height: 100%;

      background: linear-gradient(
        90deg,
        var(--sage-300),
        var(--sage-500)
      );

      border-radius: inherit;
    }

    .supporting-score {
      color: var(--muted);

      font-size: 12px;
      line-height: 1.55;
    }

    /* ---------------- About ---------------- */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;

      margin-top: 38px;
    }

    .about-grid p {
      color: var(--muted);
      line-height: 1.75;
    }

    /* ---------------- Footer ---------------- */

    footer {
      margin-top: 75px;
      padding-top: 28px;

      border-top: 1px solid var(--line);

      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .error {
      padding: 30px;

      border: 1px solid #d3b6aa;
      border-radius: 16px;

      background: #f8ece7;

      color: #805c4d;
    }

    /* ---------------- Responsive ---------------- */

    @media (max-width: 850px) {
      nav {
        align-items: flex-start;
        gap: 25px;
      }

      .nav-links {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 40px 32px;
      }

      .product-hero {
        grid-template-columns: 1fr;
      }

      .product-image {
        max-height: 190px;
      }

      .two-selectors,
      .profile-grid,
      .metric-grid,
      .compare-detail,
      .about-grid {
        grid-template-columns: 1fr;
      }

      .similar-card {
        grid-template-columns: 45px 1fr;
      }

      .score-box {
        grid-column: 2;
        text-align: left;
      }
    }

    @media (max-width: 600px) {
      .shell {
        padding-left: 18px;
        padding-right: 18px;
      }

      nav {
        flex-direction: column;
      }

      .nav-links {
        justify-content: flex-start;
      }

      .hero-title {
        font-size: 64px;
      }

      .product-hero {
        padding: 32px 26px;
      }

      .similar-card {
        padding: 25px 22px;
      }
    }
  </style>
</head>

<body>

<div class="shell">

  <nav>
    <button class="brand" data-page="home">
      BeautyGraph
    </button>

    <div class="nav-links">
      <button class="nav-link" data-page="profile">
        Product Profile
      </button>

      <button class="nav-link" data-page="compare">
        Compare Products
      </button>

      <button class="nav-link" data-page="similar">
        Similar Products
      </button>

      <button class="nav-link" data-page="about">
        About
      </button>
    </div>
  </nav>

  <main id="app">
    <div class="section-subtitle">
      Loading BeautyGraph data…
    </div>
  </main>

  <footer>
    BeautyGraph is an information-system prototype for explainable
    skincare formula comparison. Similarity and function profiles
    describe structured ingredient-list relationships and should not
    be interpreted as clinical efficacy or medical advice.
  </footer>

</div>


<script>
  let DATA = null;

  const FUNCTION_LABELS = {
    humectant: "Humectant",
    emollient: "Emollient",
    occlusive: "Occlusive",
    barrier_supporting: "Barrier supporting",
    soothing: "Soothing",
    antioxidant: "Antioxidant",
    texture_viscosity: "Texture / viscosity",
    preservative: "Preservative",
    fragrance_related: "Fragrance related",
    active_treatment: "Active treatment"
  };

  const FUNCTION_ORDER = [
    "humectant",
    "emollient",
    "occlusive",
    "barrier_supporting",
    "soothing",
    "antioxidant",
    "texture_viscosity",
    "preservative",
    "fragrance_related",
    "active_treatment"
  ];

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function pct(value) {
    return `${Math.round((Number(value) || 0) * 100)}%`;
  }

  function formLabel(value) {
    return String(value || "")
      .replaceAll("_", " ")
      .replace(/\b\w/g, char => char.toUpperCase());
  }

  function formImage(value) {
    const key = String(value || "")
      .toLowerCase()
      .trim()
      .replaceAll("-", "_")
      .replaceAll(" ", "_");

    const mapping = {
      cream: "cream.png",
      rich_cream: "cream.png",
      lotion: "lotion.png",
      gel: "gel_cream.png",
      gel_cream: "gel_cream.png",
      water_cream: "gel_cream.png",
      balm: "balm.png",
      ointment: "balm.png",
      fluid: "fluid.png",
      milk: "milk.png"
    };

    const filename = mapping[key] || "cream.png";

    return `assets/product_forms/${filename}`;
  }

  function sortedProducts() {
    return Object.values(DATA.products).sort((a, b) => {
      const labelA =
        `${a.brand} ${a.product_name}`.toLowerCase();

      const labelB =
        `${b.brand} ${b.product_name}`.toLowerCase();

      return labelA.localeCompare(labelB);
    });
  }

  function productOptions(selectedId) {
    return sortedProducts().map(product => `
      <option
        value="${esc(product.product_id)}"
        ${product.product_id === selectedId ? "selected" : ""}
      >
        ${esc(product.brand)} — ${esc(product.product_name)}
      </option>
    `).join("");
  }

  function firstProductId() {
    return sortedProducts()[0].product_id;
  }

  function pairKey(a, b) {
    return [a, b].sort().join("__");
  }

  function renderCompare(
    productAId = sortedProducts()[0].product_id,
    productBId = sortedProducts()[1].product_id
  ) {
    setActive("compare");

    if (productAId === productBId) {
      productBId = sortedProducts()
        .find(product => product.product_id !== productAId)
        .product_id;
    }

    const rawComparison =
      DATA.comparisons[pairKey(productAId, productBId)];

    if (!rawComparison) {
      document.getElementById("app").innerHTML = `
        <div class="error">
          Comparison data could not be found.
        </div>
      `;
      return;
    }


    /*
      The exported comparison is stored using canonical sorted IDs.
      Re-orient A/B-specific fields to match the user's selections.
    */

    const reverse =
      rawComparison.product_a.product_id !== productAId;

    const productA = DATA.products[productAId];
    const productB = DATA.products[productBId];

    const ingredients = rawComparison.ingredients;
    const functions = rawComparison.functions;
    const similarity = rawComparison.similarity;

    const onlyA =
      reverse ? ingredients.only_b : ingredients.only_a;

    const onlyB =
      reverse ? ingredients.only_a : ingredients.only_b;

    const shared = ingredients.shared || [];
    const sharedHigh =
      ingredients.shared_high_position || [];

    const functionDifferences =
      (functions.differences || []).map(row => ({
        ...row,
        shareA: reverse ? row.share_b : row.share_a,
        shareB: reverse ? row.share_a : row.share_b
      }));


    // ---------------------------------------------------
    // Explanation content
    // ---------------------------------------------------

    const highPositionNames =
      sharedHigh
        .slice(0, 4)
        .map(row => row.name);

    const highPositionText =
      highPositionNames.length
        ? highPositionNames.join(", ")
        : "None within the first 10 positions of both formulas.";

    const strongestFunctions =
      (functions.shared || [])
        .slice(0, 3)
        .map(row =>
          FUNCTION_LABELS[row.function_name]
          || formLabel(row.function_name)
        );

    const sharedFunctionText =
      strongestFunctions.length
        ? strongestFunctions.join(", ")
        : "No shared mapped function groups.";

    const meaningfulDifferences =
      functionDifferences
        .filter(row =>
          Number(row.absolute_difference || 0) > 1e-12
        )
        .slice(0, 2);

    let differenceHTML;

    if (meaningfulDifferences.length) {
      differenceHTML = meaningfulDifferences
        .map(row => {
          const label =
            FUNCTION_LABELS[row.function_name]
            || formLabel(row.function_name);

          return `
            <div class="line">
              <strong>${esc(label)}:</strong>
              A ${pct(row.shareA)} vs B ${pct(row.shareB)}.
            </div>
          `;
        })
        .join("");

    else {
      differenceHTML = `
        <div class="line">
          The mapped function profiles have the same
          distribution across current function groups.
        </div>
      `;
    }


    // ---------------------------------------------------
    // Chips
    // ---------------------------------------------------

      sharedHigh.length

    const sharedHTML =

        : `<span class="chip">No shared ingredients</span>`;

    const onlyAHTML =

        : `<span class="chip">None</span>`;

    // ---------------------------------------------------

    // ---------------------------------------------------

  function similarExplanation(baseId, otherId) {
    const comp =
      DATA.comparisons[pairKey(baseId, otherId)];

    if (!comp) {
      return "";
    }

    const sharedHigh =
      comp.ingredients.shared_high_position
        .slice(0, 5)
        .map(row => row.name);

    const sharedFunctions =
      comp.functions.shared
        .slice(0, 3)
        .map(row =>
          FUNCTION_LABELS[row.function_name]
          || formLabel(row.function_name)
        );

    const line1 = sharedHigh.length
      ? `Shared high-position ingredients: ${sharedHigh.join(", ")}.`
      : "No shared ingredients appear within the top 10 positions of both formulas.";

    const line2 = sharedFunctions.length
      ? `Strongest shared mapped function groups: ${sharedFunctions.join(", ")}.`
      : "No shared mapped function groups were identified.";

    return `
      <div>${esc(line1)}</div>
      <div style="margin-top:10px">${esc(line2)}</div>
    `;
  }

  function navigate(page) {
    window.scrollTo(0, 0);

    if (page === "profile") {
      renderProfile();
    }
    else if (page === "compare") {
      renderCompare();
    }
    else if (page === "similar") {
      renderSimilar();
    }
    else if (page === "about") {
      renderAbout();
    }
    else {
      renderHome();
    }
  }

  document.querySelectorAll("[data-page]").forEach(element => {
    element.addEventListener("click", () => {
      navigate(element.dataset.page);
    });
  });


  // ------------------------------------------------------
  // Load exported BeautyGraph dataset
  // ------------------------------------------------------

  fetch("beautygraph_data.json")
    .then(response => {
      if (!response.ok) {
        throw new Error(
          `Could not load beautygraph_data.json (${response.status})`
        );
      }

      return response.json();
    })
    .then(data => {
      DATA = data;
      renderHome();
    })
    .catch(error => {
      console.error(error);

      document.getElementById("app").innerHTML = `
        <div class="error">
          <strong>BeautyGraph data could not be loaded.</strong>
          <br><br>
          ${esc(error.message)}
          <br><br>
          Run this page through a local HTTP server rather than
          opening index.html directly from Finder.
        </div>
      `;
    });

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BeautyGraph</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --ivory: #faf8f2;
      --ivory-deep: #f4f1e8;

      --sage-050: #f3f5f0;
      --sage-100: #e9eee5;
      --sage-200: #d8e0d2;
      --sage-300: #bac8b4;
      --sage-400: #a5b39c;
      --sage-500: #7f9278;
      --sage-600: #647963;
      --sage-700: #4f6251;

      --ink: #354038;
      --muted: #777b73;

      --line: rgba(79, 98, 81, 0.13);
      --white-soft: rgba(255,255,255,0.58);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family: "Inter", -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      color: var(--ink);

      background:
        radial-gradient(
          ellipse at 8% 18%,
          rgba(210, 222, 205, 0.22),
          transparent 24%
        ),
        radial-gradient(
          ellipse at 91% 41%,
          rgba(232, 206, 195, 0.13),
          transparent 20%
        ),
        var(--ivory);
    }

    button,
    select {
      font: inherit;
    }

    .shell {
      max-width: 1180px;
      margin: auto;
      padding: 24px 28px 70px;
    }

    /* ---------------- Navigation ---------------- */

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--line);

      padding: 5px 0 22px;
      margin-bottom: 62px;
    }

    .brand {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--sage-700);
    }

    .nav-links {
      display: flex;
      gap: 37px;
      align-items: center;
    }

    .nav-link {
      border: none;
      background: transparent;

      padding: 10px 0;

      cursor: pointer;

      font-size: 15px;
      color: var(--muted);
    }

    .nav-link.active {
      color: var(--sage-700);
      font-weight: 600;
      position: relative;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;

      left: 16%;
      right: 16%;
      bottom: -8px;

      height: 1px;
      background: var(--sage-500);
    }

    /* ---------------- Typography ---------------- */

    .eyebrow {
      color: var(--sage-600);

      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.17em;
      text-transform: uppercase;

      margin-bottom: 12px;
    }

    h1,
    h2,
    h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;

      color: var(--ink);

      margin-top: 0;
      letter-spacing: -0.025em;
    }

    h1 {
      font-size: clamp(48px, 5vw, 66px);
      line-height: 0.98;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 45px;
      line-height: 1.05;
    }

    h3 {
      font-size: 28px;
    }

    .intro {
      max-width: 890px;

      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;

      margin: 0 0 52px;
    }

    /* ---------------- Home ---------------- */

    .hero {
      min-height: 520px;

      display: grid;
      grid-template-columns: 1fr 0.9fr;
      align-items: center;
      gap: 50px;

      padding: 58px 66px;

      border: 1px solid rgba(79,98,81,.09);
      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          rgba(243,245,240,.92),
          rgba(250,248,242,.72)
        );
    }

    .hero-title {
      font-size: clamp(70px, 7vw, 105px);
      line-height: .91;
      letter-spacing: -.05em;

      color: var(--sage-700);

      margin: 15px 0 30px;
    }

    .hero-copy {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;

      max-width: 560px;
    }

    .hero img {
      width: 100%;
      max-height: 430px;

      object-fit: contain;
      display: block;

      mix-blend-mode: multiply;
    }


    /* ---------------- Home onboarding v2 ---------------- */

    .home-section {
      margin-top: 72px;
    }

    .home-section-head {
      max-width: 800px;
      margin-bottom: 30px;
    }

    .home-section-head h2 {
      margin-bottom: 12px;
    }

    .home-lead {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.72;
    }


    /* What can you do */

    .home-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .home-card {
      padding: 27px 28px;

      border: 1px solid var(--line);
      border-radius: 22px;

      background: rgba(255,255,255,.44);
    }

    .home-card-number {
      margin-bottom: 15px;

      color: var(--sage-500);

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 34px;
      line-height: 1;
    }

    .home-card-title {
      margin-bottom: 10px;

      color: var(--ink);

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 25px;
      line-height: 1.1;
    }

    .home-card-copy {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }


    /* How BeautyGraph reads a formula */

    .logic-flow {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .logic-step {
      position: relative;

      min-width: 0;
      min-height: 190px;
      padding: 25px 22px;

      border: 1px solid var(--line);
      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(233,238,229,.60),
          rgba(255,255,255,.32)
        );
    }

    .logic-step-label {
      margin-bottom: 12px;

      color: var(--sage-600);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .logic-step-title {
      margin-bottom: 11px;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 24px;
      line-height: 1.05;
    }

    .logic-step-copy {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .example-line {
      margin-top: 13px;

      color: var(--sage-700);

      font-size: 13px;
      font-weight: 500;
      line-height: 1.55;

      overflow-wrap: anywhere;
      word-break: normal;
    }


    /* Function group preview */

    .function-preview {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px;

      margin-bottom: 18px;
    }

    .function-preview-card {
      padding: 22px 23px;

      border: 1px solid var(--line);
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(233,238,229,.54),
          rgba(255,255,255,.34)
        );
    }

    .function-preview-card strong {
      display: block;

      margin-bottom: 7px;

      color: var(--sage-700);

      font-size: 14px;
    }

    .function-preview-card span {
      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;
    }


    /* Expandable glossary */

    .function-details {
      border: 1px solid var(--line);
      border-radius: 20px;

      background: rgba(255,255,255,.30);

      overflow: hidden;
    }

    .function-details summary {
      padding: 20px 23px;

      cursor: pointer;

      color: var(--sage-700);

      font-size: 14px;
      font-weight: 600;

      list-style: none;
    }

    .function-details summary::-webkit-details-marker {
      display: none;
    }

    .function-details summary::after {
      content: "＋";
      float: right;

      color: var(--sage-500);

      font-size: 18px;
      font-weight: 400;
    }

    .function-details[open] summary::after {
      content: "−";
    }

    .function-details[open] summary {
      border-bottom: 1px solid var(--line);
    }

    .function-glossary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;

      padding: 22px;
    }

    .function-row {
      padding: 17px 19px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: rgba(255,255,255,.38);
    }

    .function-row strong {
      display: block;

      margin-bottom: 6px;

      color: var(--sage-700);

      font-size: 14px;
    }

    .function-row span {
      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;
    }


    /* Similarity scores */

    .score-explainer-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    .score-explainer {
      padding: 29px;

      border: 1px solid var(--line);
      border-radius: 23px;

      background: rgba(255,255,255,.45);
    }

    .score-question {
      margin-bottom: 9px;

      color: var(--sage-600);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .score-title {
      margin-bottom: 14px;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 29px;
      line-height: 1.05;
    }

    .score-copy {
      color: var(--muted);

      font-size: 14px;
      line-height: 1.7;
    }

    .ranking-note {
      display: inline-block;

      margin-top: 17px;
      padding: 7px 11px;

      border-radius: 999px;

      background: var(--sage-100);

      color: var(--sage-700);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .example-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;

      margin-top: 24px;
    }

    .plain-example {
      padding: 26px 28px;

      border: 1px solid var(--line);
      border-radius: 21px;

      background:
        linear-gradient(
          135deg,
          rgba(243,245,240,.72),
          rgba(255,255,255,.32)
        );
    }

    .plain-example h3 {
      margin-bottom: 12px;

      font-size: 25px;
    }

    .plain-example p {
      margin: 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.7;
    }


    /* Function Profile explainer */

    .profile-explainer {
      padding: 31px 32px;

      border: 1px solid var(--line);
      border-radius: 24px;

      background: rgba(255,255,255,.42);
    }

    .profile-principles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    .profile-principle {
      padding-right: 18px;
    }

    .profile-principle:not(:last-child) {
      border-right: 1px solid var(--line);
    }

    .profile-principle-number {
      margin-bottom: 11px;

      color: var(--sage-500);

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 29px;
      line-height: 1;
    }

    .profile-principle strong {
      display: block;

      margin-bottom: 8px;

      color: var(--ink);

      font-size: 14px;
    }

    .profile-principle p {
      margin: 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.68;
    }

    .coverage-example {
      margin-top: 27px;
      padding: 23px 25px;

      border-left: 3px solid var(--sage-300);

      background: rgba(233,238,229,.45);

      color: #596159;

      font-size: 14px;
      line-height: 1.72;
    }

    .method-note {
      margin-top: 22px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.65;
    }


    /* Homepage responsive */

    @media (max-width: 1000px) {
      .logic-flow {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 850px) {
      .home-card-grid,
      .score-explainer-grid,
      .profile-principles {
        grid-template-columns: 1fr;
      }

      .profile-principle {
        padding-right: 0;
        padding-bottom: 18px;
      }

      .profile-principle:not(:last-child) {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 700px) {
      .function-preview {
        grid-template-columns: 1fr;
      }

      .function-glossary {
        grid-template-columns: 1fr;
      }

      .example-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .logic-flow {
        grid-template-columns: 1fr;
      }

      .example-line {
        font-size: 12px;
      }

      .home-section {
        margin-top: 58px;
      }

      .profile-explainer {
        padding: 25px 23px;
      }
    }


    /* ---------------- Controls ---------------- */

    .field-label {
      color: var(--sage-700);
      font-weight: 500;

      margin-bottom: 10px;
    }

    select {
      width: 100%;

      border: 0;
      outline: 0;

      padding: 18px 16px;

      border-radius: 12px;

      background: var(--sage-100);

      color: var(--ink);
      font-size: 16px;

      cursor: pointer;
    }

    .selector-block {
      margin-bottom: 42px;
    }

    .two-selectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;

      margin-bottom: 46px;
    }

    /* ---------------- Product hero ---------------- */

    .product-hero {
      min-height: 340px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 35px;
      align-items: center;

      border: 1px solid rgba(79,98,81,.13);
      border-radius: 28px;

      background:
        linear-gradient(
          120deg,
          rgba(222,231,216,.57),
          rgba(255,255,255,.18)
        );

      padding: 45px 48px;

      margin-bottom: 55px;
    }

    .brand-name {
      color: var(--sage-600);

      text-transform: uppercase;
      letter-spacing: .16em;

      font-size: 13px;
      font-weight: 600;

      margin-bottom: 12px;
    }

    .product-title {
      font-size: clamp(44px, 5vw, 70px);
      line-height: .96;

      margin-bottom: 30px;
    }

    .tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;

      padding: 10px 16px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: rgba(255,255,255,.6);

      color: var(--sage-700);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .product-image {
      width: 100%;
      max-height: 245px;

      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* ---------------- Sections / cards ---------------- */

    .section {
      margin-top: 58px;
    }

    .section-head {
      margin-bottom: 28px;
    }

    .section-head h2 {
      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .soft-card {
      border: 1px solid var(--line);
      border-radius: 24px;

      background: rgba(255,255,255,.42);

      padding: 30px;
    }

    /* ---------------- Product Profile v2 ---------------- */

    .profile-coverage-note {
      margin: 24px 0 31px;
      padding: 22px 25px;

      border-left: 3px solid var(--sage-300);

      background: rgba(233,238,229,.46);

      color: #596159;

      font-size: 14px;
      line-height: 1.72;
    }

    .profile-coverage-note strong {
      color: var(--sage-700);
      font-weight: 600;
    }


    /* Formula function profile */

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 18px;
    }

    .profile-item {
      min-width: 0;

      padding: 23px 24px;

      background: rgba(255,255,255,.48);

      border: 1px solid var(--line);
      border-radius: 19px;
    }

    .profile-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;

      margin-bottom: 7px;
    }

    .profile-label {
      color: var(--ink);

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 23px;
      font-weight: 500;
      line-height: 1.05;
    }

    .profile-number {
      flex: 0 0 auto;

      color: var(--sage-700);

      font-size: 15px;
      font-weight: 600;
    }

    .profile-description {
      min-height: 42px;

      margin-bottom: 14px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;
    }

    .track {
      height: 7px;

      margin-bottom: 18px;

      border-radius: 999px;

      background: var(--sage-100);

      overflow: hidden;
    }

    .fill {
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--sage-300),
          var(--sage-500)
        );

      border-radius: inherit;
    }

    .profile-ingredient-label {
      margin-bottom: 9px;

      color: var(--sage-600);

      font-size: 10px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .profile-ingredient-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .profile-ingredient-chip {
      display: inline-flex;

      padding: 6px 9px;

      border: 1px solid rgba(79,98,81,.09);
      border-radius: 999px;

      background: var(--sage-050);

      color: var(--ink);

      font-size: 11px;
      line-height: 1.3;

      overflow-wrap: anywhere;
    }

    .profile-more {
      display: inline-flex;
      align-items: center;

      padding: 6px 4px;

      color: var(--muted);

      font-size: 11px;
    }

    .profile-extra-hidden {
      display: none !important;
    }

    .profile-expand-wrap {
      margin-top: 12px;
    }

    .profile-expand-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 0;

      border: none;
      background: transparent;

      color: var(--sage-600);

      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;

      cursor: pointer;
    }

    .profile-expand-button:hover {
      color: var(--sage-700);
    }

    .profile-expand-arrow {
      display: inline-block;

      font-size: 12px;
      line-height: 1;

      transition: transform .15s ease;
    }

    .profile-mapping-note {
      margin-top: 18px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.65;
    }


    /* Ingredient list */

    .ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .ingredient {
      display: inline-flex;
      align-items: center;

      max-width: 100%;

      padding: 9px 13px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: rgba(255,255,255,.55);

      color: var(--ink);

      font-size: 13px;
      line-height: 1.35;

      overflow-wrap: anywhere;
    }


    @media (max-width: 850px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }

      .profile-description {
        min-height: 0;
      }
    }


    /* ---------------- Compare ---------------- */

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;

      margin-bottom: 30px;
    }

    .metric {
      padding: 26px 25px;

      border: 1px solid var(--line);
      border-radius: 22px;

      background: rgba(255,255,255,.48);
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;

      margin-bottom: 5px;
    }

    .metric-value {
      font-family: "Cormorant Garamond", Georgia, serif;

      color: var(--sage-700);

      font-size: 54px;
      line-height: 1;
    }

    .compare-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;

      margin-top: 22px;
    }

    .detail-label {
      color: var(--sage-600);

      font-size: 12px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: .1em;

      margin-bottom: 12px;
    }

    .detail-text {
      font-size: 16px;
      line-height: 1.65;
    }

    .explanation {
      margin-top: 25px;

      padding: 27px 30px;

      border-left: 3px solid var(--sage-300);

      background: rgba(233,238,229,.46);

      color: #525c54;

      line-height: 1.75;
      font-size: 15px;
    }

    /* ---------------- Full Compare page ---------------- */

    .compare-product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;

      margin: 0 0 55px;
    }

    .compare-product-card {
      position: relative;
      overflow: hidden;

      min-height: 265px;
      padding: 34px 36px;

      border: 1px solid var(--line);
      border-radius: 26px;
    }

    .compare-product-a {
      background:
        linear-gradient(
          135deg,
          rgba(216,224,210,.76),
          rgba(250,248,242,.84)
        );
    }

    .compare-product-b {
      background:
        linear-gradient(
          135deg,
          rgba(243,228,222,.68),
          rgba(250,248,242,.88)
        );
    }

    .compare-product-copy {
      position: relative;
      z-index: 3;

      max-width: calc(100% - 150px);
    }

    .compare-label {
      margin-bottom: 15px;

      color: var(--sage-600);

      font-size: 12px;

  const FUNCTION_LABELS = {
    humectant: "Humectant",
    emollient: "Emollient",
    occlusive: "Occlusive",

    soothing: "Soothing",
    antioxidant: "Antioxidant",
    texture_viscosity: "Texture / viscosity",
    preservative: "Preservative",
    fragrance_related: "Fragrance related",
    active_treatment: "Active treatment"
  };

  const FUNCTION_ORDER = [

    "emollient",
    "occlusive",

    "soothing",
    "antioxidant",

    "active_treatment"

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function pct(value) {
    return `${Math.round((Number(value) || 0) * 100)}%`;
  }

  function formLabel(value) {
    return String(value || "")
      .replaceAll("_", " ")
      .replace(/\b\w/g, char => char.toUpperCase());
  }

  function formImage(value) {
    const key = String(value || "")
      .toLowerCase()
      .trim()
      .replaceAll("-", "_")
      .replaceAll(" ", "_");

    const mapping = {
      cream: "cream.png",
      rich_cream: "cream.png",
      lotion: "lotion.png",
      gel: "gel_cream.png",
      gel_cream: "gel_cream.png",
      water_cream: "gel_cream.png",
      balm: "balm.png",
      ointment: "balm.png",
      fluid: "fluid.png",
      milk: "milk.png"
    };

    const filename = mapping[key] || "cream.png";

    return `assets/product_forms/${filename}`;
  }

  function sortedProducts() {
    return Object.values(DATA.products).sort((a, b) => {
      const labelA =
        `${a.brand} ${a.product_name}`.toLowerCase();

      const labelB =
        `${b.brand} ${b.product_name}`.toLowerCase();

      return labelA.localeCompare(labelB);
    });
  }

  function productOptions(selectedId) {
    return sortedProducts().map(product => `
      <option
        value="${esc(product.product_id)}"
        ${product.product_id === selectedId ? "selected" : ""}
      >
        ${esc(product.brand)} — ${esc(product.product_name)}
      </option>
    `).join("");
  }

  function firstProductId() {
    return sortedProducts()[0].product_id;
  }

  function pairKey(a, b) {
    return [a, b].sort().join("__");
  }

  function setActive(page) {
    document.querySelectorAll(".nav-link").forEach(link => {

  function productHero(product) {

            src="${formImage(product.product_form)}"
            alt="${esc(formLabel(product.product_form))}"
          >
        </div>

    `;
  }


  function functionDescription(name) {
    const descriptions = {
      humectant:
        "Helps attract and hold water.",

      emollient:
        "Helps soften and smooth the skin surface.",

      occlusive:
        "Helps slow water loss by forming a more protective surface layer.",

      barrier_supporting:
        "Helps support the structure or maintenance of the skin barrier.",

      soothing:
        "Associated with calming or irritation-reducing roles.",

      antioxidant:
        "Provides an antioxidant role in the formula or on the skin.",

      texture_viscosity:
        "Helps shape how thick, smooth, or spreadable the formula is.",

      preservative:
        "Helps protect the product from microbial spoilage.",

      fragrance_related:
        "Contributes fragrance or a fragrance-related sensory role.",

      active_treatment:
        "Represents a targeted cosmetic role beyond basic moisturization."
    };

    return descriptions[name] || "";
  }


  function ingredientsForFunction(
    product,
    functionName
  ) {
    return product.ingredients
      .filter(row =>
        Array.isArray(row.functions)
        && row.functions.includes(functionName)
      )
      .sort(
        (a, b) =>
          Number(a.position) - Number(b.position)
      );
  }


  /*
   * Convert the underlying normalized Function Profile into
   * whole-number display percentages that add up to exactly 100%.
   *
   * The underlying model values are not changed.
   * This only controls how percentages are displayed in the UI.
   *
   * Method:
   * 1. Convert each function share to an exact percentage.
   * 2. Take the integer floor of each value.
   * 3. Distribute the remaining percentage points to the groups
   *    with the largest decimal remainders.
   */
  function functionProfileDisplayRows(product) {
    const profile =
      product.formula_profile || {};

    const rows = FUNCTION_ORDER
      .map((name, index) => ({
        name,
        index,
        value: Number(profile[name] || 0),
      }))
      .filter(row => row.value > 0);

    const total = rows.reduce(
      (sum, row) => sum + row.value,
      0
    );

    if (total <= 0) {
      return rows.map(row => ({
        ...row,
        displayPercent: 0,
      }));
    }

    const displayRows = rows.map(row => {
      const exactPercent =
        (row.value / total) * 100;

      const displayPercent =
        Math.floor(exactPercent);

      return {
        ...row,
        exactPercent,
        displayPercent,
        remainder:
          exactPercent - displayPercent,
      };
    });

    let pointsRemaining =
      100
      - displayRows.reduce(
          (sum, row) =>
            sum + row.displayPercent,
          0
        );

    const remainderOrder =
      [...displayRows].sort(
        (a, b) =>
          b.remainder - a.remainder
          || a.index - b.index
      );

    for (
      let i = 0;
      i < pointsRemaining;
      i += 1
    ) {
      remainderOrder[i].displayPercent += 1;
    }

    return displayRows.sort(
      (a, b) =>
        b.value - a.value
        || a.index - b.index
    );
  }


  function formulaProfile(product) {

  function orientComparison(
    comparison,
    productAId
  ) {
    if (
      comparison.product_a.product_id
      === productAId
    ) {
      return comparison;
    }

    return {
      product_a: comparison.product_b,
      product_b: comparison.product_a,

      similarity: comparison.similarity,

      ingredients: {
        shared:
          comparison.ingredients.shared.map(
            row => ({
              ...row,
              position_a: row.position_b,
              position_b: row.position_a,
            })
          ),

        shared_high_position:
          comparison.ingredients
            .shared_high_position
            .map(row => ({
              ...row,
              position_a: row.position_b,
              position_b: row.position_a,
            })),

        only_a:
          comparison.ingredients.only_b,

        only_b:
          comparison.ingredients.only_a,
      },

      functions: {
        shared:
          comparison.functions.shared.map(
            row => ({
              ...row,
              share_a: row.share_b,
              share_b: row.share_a,
            })
          ),

        differences:
          comparison.functions.differences.map(
            row => ({
              ...row,
              share_a: row.share_b,
              share_b: row.share_a,
              difference: -Number(row.difference || 0),
            })
          ),
      },
    };
  }


  function comparisonPlainSummary(
    similarity
  ) {
    const ingredient =
      Number(
        similarity.ingredient_similarity
        || 0
      );

    const formula =
      Number(
        similarity.formula_similarity
        || 0
      );

    const functions =
      Number(
        similarity.function_similarity
        || 0
      );

    if (
      functions - formula >= 0.25
    ) {
      return `
        The two formulas use
        <strong>different ingredient structures</strong>,
        but their mapped ingredients play
        <strong>much more similar overall roles</strong>.
      `;
    }

    if (
      formula - functions >= 0.20
    ) {
      return `
        The two formulas share
        <strong>more ingredient structure than functional balance</strong>.
        Their mapped function profiles differ more than
        their ingredient lists do.
      `;
    }

    if (
      ingredient >= 0.40
      && formula >= 0.40
      && functions >= 0.70
    ) {
      return `
        These formulas show
        <strong>substantial similarity in both ingredient structure
        and mapped ingredient roles</strong>.
      `;
    }

    if (
      formula < 0.20
      && functions < 0.50
    ) {
      return `
        These formulas are
        <strong>fairly different in both ingredient structure
        and mapped function pattern</strong>.
      `;
    }

    return `
      These formulas show a
      <strong>mixed relationship</strong>:
      some parts of their ingredient structure are shared,
      while their mapped function pattern may be more or less similar.
    `;
  }


  function comparisonWhyScoresDiffer(
    similarity
  ) {
    const ingredient =
      Number(
        similarity.ingredient_similarity
        || 0
      );

    const formula =
      Number(
        similarity.formula_similarity
        || 0
      );

    const functions =
      Number(
        similarity.function_similarity
        || 0
      );

    if (
      functions
      > Math.max(
          ingredient,
          formula
        ) + 0.20
    ) {
      return `
        Function Similarity is much higher because
        different ingredients can perform similar roles.
        A high Function Similarity score does not mean
        the products contain the same ingredients.
      `;
    }

    if (
      formula
      > ingredient + 0.12
    ) {
      return `
        Formula Similarity is higher than Ingredient Overlap
        because shared ingredients near the beginning of the
        ingredient lists receive more influence in the
        position-weighted formula score.
      `;
    }

    if (
      ingredient
      > formula + 0.12
    ) {
      return `
        The products share several ingredients, but those
        ingredients do not line up as strongly in the more
        influential parts of both ingredient lists.
      `;
    }

    return `
      The three scores are related but answer different questions:
      exact ingredient sharing, position-aware formula structure,
      and mapped ingredient roles.
    `;
  }

                productA.function_mapping_coverage
              )}

              &nbsp;&nbsp;·&nbsp;&nbsp;

              Product B:
              ${pct(
                productB.function_mapping_coverage
              )}

              <br><br>

              Function Profile comparison only uses
              ingredients with a current BeautyGraph
              function mapping.

              Ingredients outside the mapped portion still
              contribute to Ingredient Overlap and Formula
              Similarity.

            </div>

          </section>


          <!-- Unique ingredients -->

          <section class="section">

            <div class="section-head">

              <div class="eyebrow">
                Formula detail
              </div>

              <h2>
                Where do the ingredient lists differ?
              </h2>

              <div class="section-subtitle">
                These ingredients appear in one selected
                product but not the other.
              </div>

            </div>


            <div
              class="compare-v2-difference-grid"
            >

              <div
                class="
                  compare-v2-difference-card
                  a
                "
              >

                <h3 class="compare-v2-subheading">
                  Only in Product A
                </h3>

                <div class="compare-v2-help">
                  ${esc(productA.product_name)}
                </div>

                <div class="chip-wrap">
                  ${onlyAHTML}
                </div>

              </div>


              <div
                class="
                  compare-v2-difference-card
                  b
                "
              >

                <h3 class="compare-v2-subheading">
                  Only in Product B
                </h3>

                <div class="compare-v2-help">
                  ${esc(productB.product_name)}
                </div>

                <div class="chip-wrap">
                  ${onlyBHTML}
                </div>

              </div>

            </div>

          </section>

        </section>
      `;


    document
      .getElementById("compare-a")
      .addEventListener(
        "change",
        event => {
          renderCompare(
            event.target.value,
            document
              .getElementById("compare-b")
              .value
          );
        }
      );


    document
      .getElementById("compare-b")
      .addEventListener(
        "change",
        event => {
          renderCompare(
            document
              .getElementById("compare-a")
              .value,
            event.target.value
          );
        }
      );
  }


  // ------------------------------------------------------
  // Similar Products v2
  // ------------------------------------------------------

  function similarEvidence(
    queryProductId,
    matchProductId
  ) {
    const rawComparison =
      DATA.comparisons[
        pairKey(
          queryProductId,
          matchProductId
        )
      ];

    if (!rawComparison) {
      return {
        shared: [],
        sharedHigh: [],
      };
    }

    const comparison =
      orientComparison(
        rawComparison,
        queryProductId
      );

    return {
      shared:
        comparison.ingredients.shared
        || [],

      sharedHigh:
        comparison.ingredients
          .shared_high_position
        || [],
    };
  }


  function similarHighPositionChips(
    rows
  ) {
    if (!rows || !rows.length) {
      return `
        <span class="similar-v2-more">
          No shared ingredients appear within the
          first 10 positions of both lists.
        </span>
      `;
    }

    const visible =
      rows.slice(0, 5);

    const extra =
      rows.slice(5);


    const visibleHTML =
      visible.map(row => `
        <span class="similar-v2-chip">
          ${esc(row.name)}
        </span>
      `).join("");


    const extraHTML =
      extra.map(row => `
        <span
          class="
            similar-v2-chip
            similar-v2-chip-extra
          "
        >
          ${esc(row.name)}
        </span>
      `).join("");


    const moreButton =
      extra.length
        ? `
            <button
              type="button"
              class="similar-v2-more-button"
              data-remaining="${extra.length}"
              aria-expanded="false"
            >
              + ${extra.length} more
            </button>
          `
        : "";


    return `
      ${visibleHTML}
      ${extraHTML}
      ${moreButton}
    `;
  }


  function renderSimilar(
    productId = firstProductId()
  ) {
    setActive("similar");

    const product =
      DATA.products[productId];

    const results =
      DATA.top5[productId]
      || [];


    document

      .innerHTML = `

              do not determine the ranking.

              Results are relative to the current
              ${DATA.meta.product_count}-product

            </div>


            <div class="similar-v2-list">

              ${

                        </div>


                        <div>

                          <div

                            ${esc(result.brand)}
                          </div>

                          <div
                            class="similar-v2-name"
                          >
                            ${esc(
                              result.product_name
                            )}
                          </div>

                          <span class="tag">
                            ${esc(
                              formLabel(
                                result.product_form
                              )
                            )}
                          </span>


                          <div
                            class="similar-v2-evidence"
                          >

                            <div
                              class="
                                similar-v2-evidence-label
                              "
                            >
                              Why this match
                            </div>


                            <div
                              class="
                                similar-v2-evidence-copy
                              "
                            >
                              ${
                                evidence.shared.length
                              }
                              ingredients are shared.

                              ${
                                evidence.sharedHigh.length
                              }
                              appear within the first
                              10 positions of both
                              ingredient lists.
                            </div>


                            <div
                              class="
                                similar-v2-chip-wrap
                              "
                            >
                              ${
                                similarHighPositionChips(
                                  evidence.sharedHigh
                                )
                              }
                            </div>

                          </div>

                        </div>


                        <div
                          class="
                            similar-v2-score-panel
                          "
                        >

                          <div
                            class="
                              similar-v2-score-label
                            "
                          >
                            Ranking score
                          </div>

                          <div
                            class="similar-v2-score"
                          >
                            ${pct(
                              result.formula_similarity
                            )}
                          </div>

                          <div
                            class="
                              similar-v2-score-name
                            "
                          >
                            Formula similarity
                          </div>


                          <div
                            class="similar-v2-track"
                          >
                            <div
                              class="similar-v2-fill"
                              style="width:${
                                Math.max(
                                  0,
                                  Math.min(
                                    100,
                                    Number(
                                      result
                                        .formula_similarity
                                    )
                                    * 100
                                  )
                                )
                              }%"
                            ></div>
                          </div>


                          <div
                            class="
                              similar-v2-supporting
                            "
                          >

                            <div
                              class="
                                similar-v2-support-row
                              "
                            >
                              <span>
                                Ingredient overlap
                              </span>

                              <strong>
                                ${pct(
                                  result
                                    .ingredient_similarity
                                )}
                              </strong>
                            </div>


                            <div
                              class="
                                similar-v2-support-row
                              "
                            >
                              <span>
                                Function similarity
                              </span>

                              <strong>
                                ${pct(
                                  result
                                    .function_similarity
                                )}
                              </strong>
                            </div>

                          </div>


                          <button
                            type="button"
                            class="
                              similar-v2-compare-button
                            "
                            data-match-product="${
                              esc(
                                result.product_id
                              )
                            }"
                          >
                            Compare these products →
                          </button>

                        </div>

                      </article>
                    `;
                  }
                ).join("")
              }

            </div>

          </section>

        </section>
      `;


    document
      .getElementById("similar-select")
      .addEventListener(
        "change",
        event => {
          renderSimilar(
            event.target.value
          );
        }
      );


    document
      .querySelectorAll(
        ".similar-v2-compare-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const matchProductId =
              button.dataset
                .matchProduct;

            renderCompare(
              productId,
              matchProductId
            );

            window.scrollTo(
              0,
              0
            );
          }
        );

      });
  }




  // Similar Products v2 expand / collapse

  document.addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          ".similar-v2-more-button"
        );

      if (!button) {
        return;
      }


      const card =
        button.closest(
          ".similar-v2-card"
        );

      if (!card) {
        return;
      }


      const expanded =
        card.classList.toggle(
          "ingredients-expanded"
        );


      button.setAttribute(
        "aria-expanded",
        String(expanded)
      );


      const remaining =
        Number(
          button.dataset.remaining
          || 0
        );


      button.textContent =
        expanded
          ? "Show less"
          : `+ ${remaining} more`;
    }
  );


  // ------------------------------------------------------
  // About
  // ------------------------------------------------------

  // ------------------------------------------------------
  // Navigation
  // ------------------------------------------------------

  function navigate(page) {
    window.scrollTo(0, 0);

    if (page === "profile") {
      renderProfile();
    }
    else if (page === "compare") {
      renderCompare();
    }
    else if (page === "similar") {
      renderSimilar();
    }
    else if (page === "about") {
      renderAbout();
    }
    else {
      renderHome();
    }
  }

  document.querySelectorAll("[data-page]").forEach(element => {
    element.addEventListener("click", () => {
      navigate(element.dataset.page);
    });
  });


  // ------------------------------------------------------
  // Load exported BeautyGraph dataset
  // ------------------------------------------------------

  fetch("beautygraph_data.json")
    .then(response => {
      if (!response.ok) {
        throw new Error(
          `Could not load beautygraph_data.json (${response.status})`
        );
      }

      return response.json();
    })
    .then(data => {
      DATA = data;
      renderHome();
    })
    .catch(error => {
      console.error(error);

      document.getElementById("app").innerHTML = `
        <div class="error">
          <strong>BeautyGraph data could not be loaded.</strong>
          <br><br>
          ${esc(error.message)}
          <br><br>
          Run this page through a local HTTP server rather than
          opening index.html directly from Finder.
        </div>
      `;
    });

</script>
